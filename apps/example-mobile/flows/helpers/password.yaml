appId: io.eventyr.attestationlab
---
- scrollUntilVisible:
    element:
      id: auth-email
    direction: DOWN
- tapOn:
    id: auth-email
- eraseText: 200
- inputText: "${TEST_EMAIL}"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: auth-password
    direction: DOWN
- tapOn:
    id: auth-password
- eraseText: 200
- inputText: "${TEST_PASSWORD}"
- hideKeyboard
- tapOn:
    id: sign-in
- scrollUntilVisible:
    element:
      id: auth-status
    direction: DOWN
- extendedWaitUntil:
    visible: "Signed in.*"
    timeout: 30000
