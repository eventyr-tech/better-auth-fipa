packages:
  - packages/*
  - apps/*

onlyBuiltDependencies:
  - esbuild
overrides:
  # The latest stable loader still pins a vulnerable esbuild release.
  "@esbuild-kit/core-utils@3.3.2>esbuild": 0.25.12
  # xcode uses the v4 API; keep CommonJS support while upgrading past the advisory.
  "xcode@3.0.1>uuid": 11.1.1
patchedDependencies:
  "@better-auth/drizzle-adapter@1.7.5": patches/@better-auth__drizzle-adapter@1.7.5.patch
